# Tests, lint and image checks. Runs on every pull request to main, and is reused by
# release.yml so code that lands on main passes the same gates before it ships.
# Required status check on main: "ci-ok" (the last job), so adding jobs never means
# editing the ruleset.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      image-checks:
        description: Build and smoke-test the Docker images (release.yml does its own)
        type: boolean
        default: true

permissions:
  contents: read # default for every job; jobs ask for more only when they need it

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PNPM_VERSION: "12.16.1"
  NODE_VERSION: "24"

jobs:
  repo-lint:
    name: Repo lint (workflows, secrets, Dockerfiles, shell)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # .gitattributes forces LF for the fragile file types (shell, Dockerfile, justfile);
      # this catches CRLF or mixed line endings committed in anything else.
      # Fix with: git add --renormalize .
      - name: line endings (LF only)
        run: |
          crlf="$(git ls-files --eol | awk '$1=="i/crlf" || $1=="i/mixed" || $2=="w/crlf" || $2=="w/mixed"')"
          if [ -n "$crlf" ]; then
            printf '::error::CRLF or mixed line endings found in tracked files\n%s\n' "$crlf"
            exit 1
          fi

      - name: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL -o /tmp/actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint -color

      - name: zizmor (workflow security)
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          persona: pedantic # PLAN.md section 8 gates on zizmor pedantic-clean, not just regular

      - name: gitleaks (secrets in the working tree)
        run: |
          docker run --rm -v "${PWD}:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir /repo --redact --no-banner

      - name: hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          recursive: true
          dockerfile: Dockerfile

      - name: shellcheck
        run: find . -name '*.sh' -not -path '*/node_modules/*' -print0 | xargs -0 -r shellcheck

  api:
    name: API (ruff, mypy, basedpyright, pytest, migrations, audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rekalled_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENV: test
      AUTH_MODE: dev
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/rekalled_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/rekalled_test
      # Harmless placeholder: start-up validation requires a gateway key for the default
      # ai generator. Tests never call a real model (conftest disables model requests).
      PYDANTIC_AI_GATEWAY_API_KEY: pylf_v1_eu_ci-not-a-real-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: apps/api
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run basedpyright --project ../../pyrightconfig.json
      - run: uv run pytest
      - name: Migrations match the models (no missing autogenerate)
        run: uv run alembic check
      - name: Known vulnerabilities in runtime dependencies
        run: uv audit --locked --no-dev

  web:
    name: Web (vp check, vp test, build, audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp check
      - run: pnpm exec vp test run --passWithNoTests
      - run: pnpm build
      - name: Known vulnerabilities in production dependencies
        run: pnpm audit --prod --audit-level high

  images:
    name: Images (build, smoke test, scan)
    if: github.event_name == 'pull_request' || inputs.image-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rekalled_smoke
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/api
          file: apps/api/Dockerfile
          load: true
          push: false
          tags: rekalled-api:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/web
          file: apps/web/Dockerfile
          load: true
          push: false
          tags: rekalled-web:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Smoke test (migrations on start, health, auth enforced)
        run: scripts/ci/smoke-images.sh rekalled-api:ci rekalled-web:ci "${GITHUB_SHA}"

      - name: Scan API image (Grype)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: rekalled-api:ci
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: table

      - name: Scan web image (Grype)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: rekalled-web:ci
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: table

  # The single required check. "skipped" counts as passing so release.yml can turn the
  # image job off; any failure or cancellation fails this job.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [repo-lint, api, web, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: All required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: ${RESULTS}"
          for r in ${RESULTS}; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
