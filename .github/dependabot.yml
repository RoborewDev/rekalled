# Weekly, grouped dependency updates. Each PR goes through the same CI and CodeRabbit
# review as any other change. cooldown waits a week after a release before proposing it,
# which avoids picking up a compromised version in its first days.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      actions: { patterns: ["*"] }
    commit-message: { prefix: ci }

  - package-ecosystem: uv
    directory: /apps/api
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      api-minor-patch: { update-types: [minor, patch] }
    commit-message: { prefix: "build(api)" }

  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      web-minor-patch: { update-types: [minor, patch] }
    commit-message: { prefix: "build(web)" }

  - package-ecosystem: docker
    directories: [/apps/api, /apps/web]
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    commit-message: { prefix: "build(docker)" }
