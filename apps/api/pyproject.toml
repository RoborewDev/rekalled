[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Robin Andrew", email = "robinrew@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
  "ai>=0.8.0",
  "alembic>=1.20.1",
  "asyncpg>=0.32.0",
  "fastapi[standard]>=0.162.0",
  "fsrs>=6.3.2",
  "pydantic-ai-slim[openai]>=2.64.0",
  "pydantic-settings>=2.16.2",
  "pyjwt[crypto]>=2.15.1",
  "sqlalchemy[asyncio]>=2.1.6",
]

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "mypy>=2.4.1",
  "pytest>=9.2.0",
  "pytest-asyncio>=1.4.1.post1",
  "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
